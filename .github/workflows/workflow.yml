name: Laravel CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-quality-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-quality-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP code style
        run: vendor/bin/pint --test

      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon') }}
          restore-keys: |
            phpstan-${{ runner.os }}-

      - name: Run PHPStan analysis
        run: vendor/bin/phpstan analyse --no-progress

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_ci
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel_ci
      DB_USERNAME: laravel
      DB_PASSWORD: secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-tests-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-tests-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Prepare test report directory
        run: mkdir -p build/test-results

      - name: Run Laravel tests
        run: vendor/bin/phpunit

      - name: Upload PHPUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-test-report
          path: build/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Build frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  
  deploy-staging:
    name: Deploy to staging
    needs: [code-quality, integration-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$STAGING_USER@$STAGING_HOST" 'bash -se' <<'REMOTE'
              set -euo pipefail

              cd /var/www/news-casting

              if [ -n "$(git status --porcelain)" ]; then
                  echo "Deployment aborted: working tree is not clean."
                  exit 1
              fi

              echo "Fetching latest application code..."
              git pull --ff-only origin main

              echo "Installing production PHP dependencies..."
              composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

              echo "Installing frontend dependencies..."
              npm ci

              echo "Building frontend assets..."
              npm run build

              echo "Running database migrations..."
              php artisan migrate --force

              echo "Clearing old Laravel caches..."
              php artisan optimize:clear

              echo "Building Laravel configuration cache..."
              php artisan config:cache

              echo "Checking application HTTP response..."
              curl --fail --silent --show-error \
                  -H "Host: 193.123.191.202" \
                  http://127.0.0.1/ \
                  -o /dev/null

              echo "Application health check passed."

              echo "Staging deployment completed."
          REMOTE